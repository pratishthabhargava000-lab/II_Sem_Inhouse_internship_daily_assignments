<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple vs Banana Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍎 Apple Vs Banana 🍌</h1>

<div id="info">

<div>🍎 Apple : <span id="appleScore">0</span></div>

<div>🍌 Banana : <span id="bananaScore">0</span></div>

<div>⏱️ Time : <span id="timer">30</span></div>

</div>

<h2 id="winner"></h2>

<button onclick="restartGame()" id="playAgain">
Play Again
</button>

<img src="images/apple 2.png" id="apple" class="fruit">
<img src="images/banana.jpg" id="banana" class="fruit">
<script src="game.js"></script>
</body>
</html>
